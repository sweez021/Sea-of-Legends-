<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sea of Legends — Île de l'Aube 3D</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#6fc8df;font-family:Arial}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}.box{background:#071522dd;border:1px solid #ffffff33;border-radius:12px;padding:12px 16px}.title{position:absolute;left:16px;top:16px;font-size:21px;font-weight:800}.title small{display:block;font-size:11px;opacity:.7;margin-top:4px}.quest{position:absolute;right:16px;top:16px;width:225px;font-size:13px}.help{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap}</style></head><body>
<canvas id="game"></canvas>
<div id="ui"><div id="title" class="box">ÎLE DE L'AUBE<small>Sea of Legends • 3D autonome</small></div>
<div id="quest" class="box"><b>📜 Première aventure</b><br>Explore le village et rejoins la plage.</div>
<div id="help" class="box">ZQSD / WASD / Flèches • Souris : caméra • Molette : zoom • R : départ</div></div>
<script>// Moteur 3D WebGL autonome : aucune librairie externe.
const c=document.getElementById("game"),gl=c.getContext("webgl",{antialias:true});
if(!gl){document.body.innerHTML="<h2 style='color:white;padding:30px;font-family:Arial'>WebGL n'est pas disponible dans ce navigateur.</h2>";throw Error("WebGL unavailable")}
const vs=`attribute vec3 p;attribute vec3 col;uniform mat4 mvp;varying vec3 v;void main(){gl_Position=mvp*vec4(p,1.0);v=col;}`;
const fs=`precision mediump float;varying vec3 v;void main(){gl_FragColor=vec4(v,1.0);}`;
function shader(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
const P=gl.getAttribLocation(prog,"p"),C=gl.getAttribLocation(prog,"col"),M=gl.getUniformLocation(prog,"mvp");
let verts=[],cols=[],faces=[];
function color(a){return a}
function box(x,y,z,w,h,d,col){
 const x0=x-w/2,x1=x+w/2,y0=y,y1=y+h,z0=z-d/2,z1=z+d/2;
 const v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
 const f=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[1,5,6,2],[0,3,7,4]];
 for(const q of f){for(const i of [0,1,2,0,2,3]){const a=v[q[i]];verts.push(...a);cols.push(...col)}}}
function cyl(cx,cy,cz,r,h,col,n=16){
 for(let i=0;i<n;i++){let a=i*2*Math.PI/n,b=(i+1)*2*Math.PI/n;box(cx+Math.cos((a+b)/2)*r,cy,cz+Math.sin((a+b)/2)*r,Math.max(.8,r*2*Math.sin(Math.PI/n)),h,Math.max(.8,r*2*Math.sin(Math.PI/n)),col)}
}
const G=[.34,.57,.29],S=[.82,.68,.36],D=[.64,.48,.27],W=[.39,.23,.12],R=[.43,.46,.44],ROOFS=[[.66,.25,.20],[.82,.52,.15],[.20,.43,.52],[.56,.28,.24],[.22,.43,.31]];
// île
box(0,-10,0,430,16,430,G);box(0,0,0,455,5,455,S);box(0,3,0,400,6,400,G);
box(0,6,70,22,1,250,D);box(-105,6,0,210,1,18,D);box(105,6,0,210,1,18,D);box(0,6,0,25,1,120,D);
// maisons
const houses=[];
function house(x,z,w,d,rc){box(x,7,z,w,18,d,[.82,.75,.59]);box(x,25,z,w+6,d+6,5,rc);box(x,7,z+d/2+.5,5,8,1,W);houses.push([x,z,w,d])}
house(-42,-48,46,31,ROOFS[0]);house(45,-50,49,33,ROOFS[1]);house(98,-5,43,30,ROOFS[2]);house(-108,-2,43,30,ROOFS[3]);house(100,56,49,33,ROOFS[1]);house(-48,64,49,33,ROOFS[4]);house(48,70,43,30,ROOFS[3]);
// arbres
for(let i=0;i<100;i++){let x,z;do{x=(Math.random()-.5)*380;z=(Math.random()-.5)*370}while(Math.hypot(x,z)>190||(Math.abs(x)<90&&Math.abs(z)<90));box(x,6,z,4,18,4,W);cyl(x,20,z,8,12,[.12,.38,.20],12)}
// rochers
for(let i=0;i<40;i++){let a=Math.random()*6.28,r=150+Math.random()*45;box(Math.cos(a)*r,6,Math.sin(a)*r,6,6,5,R)}
// quai
for(let i=0;i<10;i++)box(-150+i*9,7,-225,7,2,12,W);
// joueur
function playerMesh(x,z){box(x,7,z,7,14,7,[.12,.30,.65]);cyl(x,21,z,4,8,[.92,.68,.48],12);cyl(x,27,z,5.5,2,[.88,.63,.12],16);box(x,26,z,11,1,2,[.25,.12,.07])}
let px=0,pz=135;playerMesh(px,pz);
// PNJ
function npc(x,z,col){box(x,7,z,6,14,6,col);cyl(x,20,z,3.7,7,[.82,.55,.39],12)}npc(-20,22,[.22,.48,.35]);npc(25,15,[.50,.25,.60]);npc(-65,-18,[.62,.39,.20]);
// matrices
function persp(fov,asp,n,f){let t=1/Math.tan(fov/2),q=1/(n-f);return[t/asp,0,0,0,0,t,0,0,0,0,(f+n)*q,-1,0,0,2*f*n*q,0]}
function look(eye,tar,up){let zx=eye[0]-tar[0],zy=eye[1]-tar[1],zz=eye[2]-tar[2],zl=Math.hypot(zx,zy,zz);zx/=zl;zy/=zl;zz/=zl;let xx=up[1]*zz-up[2]*zy,xy=up[2]*zx-up[0]*zz,xz=up[0]*zy-up[1]*zx,xl=Math.hypot(xx,xy,xz);xx/=xl;xy/=xl;xz/=xl;let yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;return[xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,-(xx*eye[0]+xy*eye[1]+xz*eye[2]),-(yx*eye[0]+yy*eye[1]+yz*eye[2]),-(zx*eye[0]+zy*eye[1]+zz*eye[2]),1]}
function mul(a,b){let r=new Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++)r[i*4+j]=a[i*4]*b[j]+a[i*4+1]*b[4+j]+a[i*4+2]*b[8+j]+a[i*4+3]*b[12+j];return r}
const vb=gl.createBuffer(),cb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);gl.vertexAttribPointer(P,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(P);gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(cols),gl.STATIC_DRAW);gl.vertexAttribPointer(C,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(C);
const keys={};addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()=="r"){px=0;pz=135}});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
let yaw=0,pitch=.68,dist=115,drag=false,lx=0,ly=0; c.addEventListener("mousedown",e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener("mouseup",()=>drag=false);addEventListener("mousemove",e=>{if(!drag)return;yaw-=(e.clientX-lx)*.006;pitch+=(e.clientY-ly)*.004;pitch=Math.max(.3,Math.min(1.2,pitch));lx=e.clientX;ly=e.clientY});c.addEventListener("wheel",e=>{dist=Math.max(45,Math.min(170,dist+e.deltaY*.08))});
function blocked(x,z){if(Math.hypot(x,z)>195)return true;for(const b of houses)if(Math.abs(x-b[0])<b[2]/2+4&&Math.abs(z-b[1])<b[3]/2+4)return true;return false}
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;gl.viewport(0,0,c.width,c.height)}addEventListener("resize",resize);resize();gl.enable(gl.DEPTH_TEST);gl.clearColor(.42,.75,.84,1);
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;let x=0,z=0;if(keys.z||keys.w||keys.arrowup)z--;if(keys.s||keys.arrowdown)z++;if(keys.q||keys.a||keys.arrowleft)x--;if(keys.d||keys.arrowright)x++;if(x||z){let l=Math.hypot(x,z);x/=l;z/=l;let nx=px+x*42*dt,nz=pz+z*42*dt;if(!blocked(nx,pz))px=nx;if(!blocked(px,nz))pz=nz}
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const eye=[px+Math.sin(yaw)*dist*Math.cos(pitch),10+Math.sin(pitch)*dist,pz+Math.cos(yaw)*dist*Math.cos(pitch)];const pv=mul(persp(1.0,c.width/c.height,.1,900),look(eye,[px,8,pz],[0,1,0]));gl.uniformMatrix4fv(M,false,new Float32Array(pv));gl.drawArrays(gl.TRIANGLES,0,verts.length/3);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
