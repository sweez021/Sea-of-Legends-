<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Line — Île de l'Aube V0.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07141e;font-family:Arial,sans-serif}
#game{display:block;width:100vw;height:100vh;image-rendering:auto}
#hud{position:fixed;left:18px;top:18px;color:#fff;pointer-events:none;text-shadow:0 2px 4px #000}
.card{background:rgba(10,22,32,.78);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 15px;backdrop-filter:blur(5px)}
#title{font-size:20px;font-weight:800}#sub{font-size:12px;opacity:.75;margin-top:3px}
#help{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#fff;font-size:13px;white-space:nowrap}
#quest{position:fixed;right:18px;top:18px;width:250px;color:#fff}
#quest b{font-size:15px}#quest span{font-size:12px;opacity:.78;line-height:1.45}
#fade{position:fixed;inset:0;background:#07141e;opacity:0;pointer-events:none;transition:opacity .25s}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="card"><div id="title">ÎLE DE L'AUBE</div><div id="sub">Grand Line — V0.1</div></div></div>
<div id="quest"><div class="card"><b>📜 Première aventure</b><br><span>Explore le village et rejoins la plage.</span></div></div>
<div id="help" class="card">ZQSD / WASD / Flèches — déplacer • Molette — zoom • R — recentrer</div>
<div id="fade"></div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

const world={w:3600,h:2800};
const island={x:180,y:140,w:3240,h:2520};
let zoom=.72;
const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==="r"){player.x=1800;player.y=1500}});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener("wheel",e=>{zoom+=e.deltaY<0?.06:-.06;zoom=Math.max(.5,Math.min(1.35,zoom));e.preventDefault()},{passive:false});

const player={x:1800,y:1660,r:24,speed:300,dir:0,walk:0};
const cam={x:0,y:0};
const buildings=[
 {x:1510,y:1050,w:280,h:190,name:"Taverne",roof:"#b34d37"},
 {x:1900,y:1040,w:300,h:210,name:"Maison",roof:"#d58b39"},
 {x:2280,y:1200,w:280,h:190,name:"Boutique",roof:"#3c7896"},
 {x:1170,y:1420,w:260,h:190,name:"Maison",roof:"#a95c49"},
 {x:2480,y:1660,w:310,h:210,name:"Maison",roof:"#bd7140"},
 {x:1420,y:1950,w:300,h:200,name:"Maison",roof:"#3c7f68"},
 {x:2030,y:1980,w:280,h:190,name:"Maison",roof:"#a85a4b"}
];
const trees=[];
function rnd(a,b){return a+Math.random()*(b-a)}
for(let i=0;i<135;i++){
 let x,y;
 do{x=rnd(350,3250);y=rnd(330,2450)}
 while(Math.abs(x-1800)<850 && Math.abs(y-1600)<600);
 trees.push({x,y,s:rnd(.75,1.35)});
}
const rocks=[];
for(let i=0;i<55;i++)rocks.push({x:rnd(260,3340),y:rnd(240,2560),s:rnd(.5,1.4)});

function inIsland(x,y){return x>island.x+65&&x<island.x+island.w-65&&y>island.y+65&&y<island.y+island.h-65}
function blocked(x,y){
 const rr=player.r+6;
 for(const b of buildings)if(x+rr>b.x-b.w/2&&x-rr<b.x+b.w/2&&y+rr>b.y-b.h/2&&y-rr<b.y+b.h/2)return true;
 return false;
}
function move(dt){
 let dx=0,dy=0;
 if(keys["w"]||keys["z"]||keys["arrowup"])dy--;
 if(keys["s"]||keys["arrowdown"])dy++;
 if(keys["a"]||keys["q"]||keys["arrowleft"])dx--;
 if(keys["d"]||keys["arrowright"])dx++;
 if(dx||dy){
  const l=Math.hypot(dx,dy);dx/=l;dy/=l;
  const nx=player.x+dx*player.speed*dt,ny=player.y+dy*player.speed*dt;
  if(inIsland(nx,player.y)&&!blocked(nx,player.y))player.x=nx;
  if(inIsland(player.x,ny)&&!blocked(player.x,ny))player.y=ny;
  player.dir=Math.atan2(dy,dx);player.walk+=dt*10;
 } else player.walk*=.85;
 cam.x+=(player.x-cam.x-(W/2)/zoom)*Math.min(1,dt*8);
 cam.y+=(player.y-cam.y-(H/2)/zoom)*Math.min(1,dt*8);
 cam.x=Math.max(0,Math.min(world.w-W/zoom,cam.x));
 cam.y=Math.max(0,Math.min(world.h-H/zoom,cam.y));
}
function screenX(x){return (x-cam.x)*zoom}function screenY(y){return (y-cam.y)*zoom}
function poly(points,fill){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(screenX(p[0]),screenY(p[1])):ctx.moveTo(screenX(p[0]),screenY(p[1])));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(screenX(x),screenY(y),rx*zoom,ry*zoom,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function text(t,x,y,size,fill="#fff"){ctx.font=`700 ${size*zoom}px Arial`;ctx.textAlign="center";ctx.fillStyle=fill;ctx.fillText(t,screenX(x),screenY(y))}

function drawSea(){
 ctx.fillStyle="#0b6d82";ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalAlpha=.18;ctx.strokeStyle="#d9ffff";ctx.lineWidth=2;
 for(let y=-80;y<H+100;y+=48){ctx.beginPath();for(let x=-50;x<W+80;x+=80){ctx.moveTo(x,y);ctx.quadraticCurveTo(x+20,y-9,x+40,y);ctx.quadraticCurveTo(x+60,y+9,x+80,y)}ctx.stroke()}ctx.restore();
}
function drawIsland(){
 ctx.save();
 ctx.shadowColor="rgba(0,0,0,.45)";ctx.shadowBlur=35;ctx.shadowOffsetY=20;
 ellipse(island.x+island.w/2,island.y+island.h/2,island.w/2,island.h/2,"#c7a85b");ctx.restore();
 ellipse(island.x+island.w/2,island.y+island.h/2,island.w/2-35,island.h/2-35,"#6b9b57");
 // sandy beaches
 ctx.save();ctx.globalAlpha=.85;
 ellipse(1810,1580,1500,1130,"#d7b867");
 ellipse(1810,1580,1425,1055,"#5f9651");
 ctx.restore();
 // grass patches
 ctx.globalAlpha=.14;for(let i=0;i<160;i++){let x=rnd(350,3250),y=rnd(330,2440);if(inIsland(x,y))ellipse(x,y,rnd(15,45),rnd(8,22),"#285d3d")}ctx.globalAlpha=1;
 // central roads
 ctx.lineCap="round";ctx.lineWidth=105*zoom;ctx.strokeStyle="#c99e5c";
 ctx.beginPath();ctx.moveTo(screenX(1800),screenY(2390));ctx.lineTo(screenX(1800),screenY(1900));ctx.lineTo(screenX(1800),screenY(1350));ctx.lineTo(screenX(1800),screenY(760));ctx.stroke();
 ctx.beginPath();ctx.moveTo(screenX(700),screenY(1580));ctx.lineTo(screenX(1200),screenY(1580));ctx.lineTo(screenX(1800),screenY(1580));ctx.lineTo(screenX(2750),screenY(1580));ctx.stroke();
 ctx.lineWidth=54*zoom;ctx.strokeStyle="#e0b978";
 ctx.beginPath();ctx.moveTo(screenX(1800),screenY(2390));ctx.lineTo(screenX(1800),screenY(760));ctx.stroke();
 ctx.beginPath();ctx.moveTo(screenX(700),screenY(1580));ctx.lineTo(screenX(2750),screenY(1580));ctx.stroke();
 // pier
 ctx.fillStyle="#8b5b39";for(let x=300;x<760;x+=70)ctx.fillRect(screenX(x),screenY(1550),55*zoom,65*zoom);
}
function drawBuilding(b){
 const x=screenX(b.x),y=screenY(b.y),w=b.w*zoom,h=b.h*zoom;
 ctx.save();ctx.shadowColor="rgba(0,0,0,.28)";ctx.shadowBlur=12;ctx.shadowOffsetY=8;
 ctx.fillStyle="#d7c29b";ctx.fillRect(x-w/2,y-h/2,w,h);
 ctx.fillStyle=b.roof;ctx.beginPath();ctx.moveTo(x-w/2-12*zoom,y-h/2);ctx.lineTo(x,y-h/2-75*zoom);ctx.lineTo(x+w/2+12*zoom,y-h/2);ctx.closePath();ctx.fill();
 ctx.restore();
 ctx.fillStyle="#6c4632";ctx.fillRect(x-20*zoom,y+15*zoom,40*zoom,55*zoom);
 ctx.fillStyle="#9fd1dc";ctx.fillRect(x-w*.28,y-h*.1,42*zoom,38*zoom);ctx.fillRect(x+w*.12,y-h*.1,42*zoom,38*zoom);
 text(b.name,b.x,b.y-h/2-95,14,"#fff");
}
function drawTree(t){
 const x=screenX(t.x),y=screenY(t.y),s=t.s*zoom;
 ctx.save();
 ctx.fillStyle="#6d4930";ctx.fillRect(x-9*s,y-2*s,18*s,55*s);
 ctx.fillStyle="#214f38";ctx.beginPath();ctx.arc(x,y-20*s,42*s,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#2e7045";ctx.beginPath();ctx.arc(x-25*s,y-4*s,30*s,0,Math.PI*2);ctx.arc(x+26*s,y-2*s,29*s,0,Math.PI*2);ctx.arc(x,y-45*s,31*s,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawRock(r){ellipse(r.x,r.y,24*r.s,15*r.s,"#718078")}
function drawPlayer(){
 const bob=Math.sin(player.walk)*3;
 const x=screenX(player.x),y=screenY(player.y+bob);
 ctx.save();
 ctx.translate(x,y);ctx.rotate(player.dir+Math.PI/2);
 ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(0,17*zoom,25*zoom,10*zoom,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#2b55a4";ctx.fillRect(-16*zoom,-2*zoom,32*zoom,34*zoom);
 ctx.fillStyle="#f1bd8d";ctx.beginPath();ctx.arc(0,-20*zoom,19*zoom,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#e7b43e";ctx.beginPath();ctx.ellipse(0,-31*zoom,28*zoom,9*zoom,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#38251b";ctx.fillRect(-18*zoom,-34*zoom,36*zoom,8*zoom);
 ctx.fillStyle="#f1bd8d";ctx.fillRect(-22*zoom,6*zoom,10*zoom,25*zoom);ctx.fillRect(12*zoom,6*zoom,10*zoom,25*zoom);
 ctx.restore();
}
function draw(){
 drawSea();drawIsland();
 const items=[...rocks.map(o=>({y:o.y,type:"r",o})),...trees.map(o=>({y:o.y,type:"t",o})),...buildings.map(o=>({y:o.y,type:"b",o})),{y:player.y,type:"p",o:player}].sort((a,b)=>a.y-b.y);
 for(const it of items){if(it.type==="r")drawRock(it.o);else if(it.type==="t")drawTree(it.o);else if(it.type==="b")drawBuilding(it.o);else drawPlayer()}
 // location marker
 ctx.globalAlpha=.7+Math.sin(performance.now()/300)*.2;text("✦",1800,680,24,"#ffe58a");ctx.globalAlpha=1;text("VILLAGE DE L'AUBE",1800,620,18);
}
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;move(dt);draw();requestAnimationFrame(loop)}
player.x=1800;player.y=2260;cam.x=1800-W/2;cam.y=2260-H/2;requestAnimationFrame(loop);
</script>
</body>
</html>
