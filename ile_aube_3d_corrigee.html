<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Île de l'Aube 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#69bfd8;font-family:Arial}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}.box{background:#071522dd;border:1px solid #ffffff33;border-radius:12px;padding:12px 16px}#title{position:absolute;top:16px;left:16px;font-size:21px;font-weight:bold}#title small{display:block;font-size:11px;opacity:.7;margin-top:4px}#quest{position:absolute;top:16px;right:16px;width:220px;font-size:13px}#help{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap}</style></head><body><div id="ui"><div id="title" class="box">ÎLE DE L'AUBE<small>Grand Line Online • 3D V0.3</small></div><div id="quest" class="box"><b>📜 Première aventure</b><br>Explore le village et rejoins la plage.</div><div id="help" class="box">ZQSD / WASD / Flèches • Souris : caméra • Molette : zoom • R : départ</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script>
if(!window.THREE){document.body.innerHTML='<div style="color:white;text-align:center;padding:40px;font:20px Arial">Impossible de charger la 3D. Vérifie ta connexion Internet puis recharge la page.</div>'}
else{
const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x75c9df);scene.fog=new T.Fog(0x75c9df,180,620);
const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,1200);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
camera.position.set(0,105,145);
scene.add(new T.HemisphereLight(0xcff7ff,0x36552d,2.4));const sun=new T.DirectionalLight(0xffefc7,3.2);sun.position.set(-120,180,100);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const M=c=>new T.MeshStandardMaterial({color:c,roughness:.9}),grass=M(0x57934e),sand=M(0xd8b86a),dirt=M(0xb9905b),wood=M(0x74472d);
const island=new T.Group();scene.add(island);
let o=new T.Mesh(new T.CylinderGeometry(210,225,14,64),grass);o.position.y=-7;o.receiveShadow=true;island.add(o);
o=new T.Mesh(new T.CylinderGeometry(220,235,7,64),sand);o.position.y=-1;island.add(o);
o=new T.Mesh(new T.CylinderGeometry(195,205,8,64),grass);o.position.y=3;o.receiveShadow=true;island.add(o);
function road(x,z,w,d){let r=new T.Mesh(new T.BoxGeometry(w,.8,d),dirt);r.position.set(x,7,z);island.add(r)}road(0,75,20,250);road(-105,0,210,18);road(105,0,210,18);road(0,0,25,120);
const houses=[];function house(x,z,w,d,c){let g=new T.Group();let b=new T.Mesh(new T.BoxGeometry(w,18,d),M(0xe2d2ab));b.position.y=14;b.castShadow=true;g.add(b);let r=new T.Mesh(new T.ConeGeometry(Math.max(w,d)*.72,15,4),M(c));r.rotation.y=Math.PI/4;r.position.y=31;r.castShadow=true;g.add(r);let door=new T.Mesh(new T.BoxGeometry(5,8,1),wood);door.position.set(0,9,d/2+.5);g.add(door);for(let xw of[-w*.28,w*.28]){let win=new T.Mesh(new T.BoxGeometry(6,5,1),M(0x8ed0dc));win.position.set(xw,16,d/2+.5);g.add(win)}g.position.set(x,0,z);island.add(g);houses.push({x,z,w,d})}
house(-42,-48,46,31,0xa84c3c);house(45,-50,49,33,0xd28635);house(98,-5,43,30,0x39758b);house(-108,-2,43,30,0x9f5747);house(100,56,49,33,0xd28635);house(-48,64,49,33,0x3e795e);house(48,70,43,30,0x9f5747);
function tree(x,z,s){let g=new T.Group(),tr=new T.Mesh(new T.CylinderGeometry(2*s,2.8*s,17*s,8),wood);tr.position.y=12*s;tr.castShadow=true;g.add(tr);for(let q of[[0,28,0],[-7,24,1],[7,24,-1],[0,35,0]]){let l=new T.Mesh(new T.IcosahedronGeometry(9*s,1),M(0x2e7046));l.position.set(q[0],q[1]*s,q[2]);l.castShadow=true;g.add(l)}g.position.set(x,0,z);island.add(g)}
for(let i=0;i<100;i++){let x,z;do{x=(Math.random()-.5)*380;z=(Math.random()-.5)*370}while(Math.hypot(x,z)>192||(Math.abs(x)<88&&Math.abs(z)<88));tree(x,z,.7+Math.random()*.65)}
for(let i=0;i<40;i++){let a=Math.random()*Math.PI*2,r=150+Math.random()*55,k=new T.Mesh(new T.DodecahedronGeometry(2+Math.random()*4),M(0x777f77));k.position.set(Math.cos(a)*r,6,Math.sin(a)*r);k.scale.y=.6;k.castShadow=true;island.add(k)}
for(let i=0;i<10;i++){let p=new T.Mesh(new T.BoxGeometry(7,2,12),wood);p.position.set(-150+i*9,7,-225);p.castShadow=true;island.add(p)}
let water=new T.Mesh(new T.PlaneGeometry(1800,1800),M(0x167d95));water.rotation.x=-Math.PI/2;water.position.y=-15;scene.add(water);
const player=new T.Group();let body=new T.Mesh(new T.CapsuleGeometry(3.5,8,6,12),M(0x2f5eae));body.position.y=12;body.castShadow=true;player.add(body);let head=new T.Mesh(new T.SphereGeometry(4.2,16,12),M(0xf0bb8b));head.position.y=21;head.castShadow=true;player.add(head);let hat=new T.Mesh(new T.CylinderGeometry(5.7,5.7,1.7,24),M(0xe6b13d));hat.position.y=25.5;hat.castShadow=true;player.add(hat);let band=new T.Mesh(new T.CylinderGeometry(5.8,5.8,.7,24),M(0x482719));band.position.y=25;player.add(band);scene.add(player);player.position.set(0,0,135);
const npcs=[];function npc(x,z,c){let g=new T.Group(),b=new T.Mesh(new T.CapsuleGeometry(3,7,5,10),M(c));b.position.y=11;g.add(b);let h=new T.Mesh(new T.SphereGeometry(3.7,14,10),M(0xd9a77d));h.position.y=20;g.add(h);g.position.set(x,0,z);scene.add(g);npcs.push(g)}npc(-20,22,0x3e7d5d);npc(25,15,0x8b4eae);npc(-65,-18,0x9c633e);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='r')player.position.set(0,0,135)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let yaw=0,pitch=.65,dist=115,drag=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('mousedown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});addEventListener('mouseup',()=>drag=false);addEventListener('mousemove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.006;pitch+=(e.clientY-lastY)*.004;pitch=Math.max(.35,Math.min(1.15,pitch));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('wheel',e=>{dist+=e.deltaY*.08;dist=Math.max(48,Math.min(175,dist))},{passive:true});
function blocked(x,z){if(Math.hypot(x,z)>198)return true;for(let b of houses)if(Math.abs(x-b.x)<b.w/2+4&&Math.abs(z-b.z)<b.d/2+4)return true;return false}
const clock=new T.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05),x=0,z=0;if(keys.z||keys.w||keys.arrowup)z--;if(keys.s||keys.arrowdown)z++;if(keys.q||keys.a||keys.arrowleft)x--;if(keys.d||keys.arrowright)x++;if(x||z){let l=Math.hypot(x,z);x/=l;z/=l;let nx=player.position.x+x*45*dt,nz=player.position.z+z*45*dt;if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz;player.rotation.y=Math.atan2(x,z);body.rotation.z=Math.sin(performance.now()/90)*.08}else body.rotation.z*=.85;
const tx=player.position.x,ty=10,tz=player.position.z;camera.position.set(tx+Math.sin(yaw)*dist*Math.cos(pitch),ty+Math.sin(pitch)*dist,tz=tz+Math.cos(yaw)*dist*Math.cos(pitch));camera.lookAt(tx,12,tz);renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}
</script></body></html>
